version: "3.9"

services:
  cpanel-ddns-ui:
    build:
      context: ./ui
    container_name: cpanel-ddns-ui
    restart: unless-stopped
    environment:
      # Optional defaults. Users can change everything in the UI.
      TZ: "UTC"
      DEFAULT_CHECK_INTERVAL: "300"
      DEFAULT_IP_CHECK_URL: "https://api.ipify.org"
      # Optional: if you want to prefill (can be left blank)
      DEFAULT_WEBCALL_URL: ""
    volumes:
      - cpanel_ddns_config:/config
    ports:
      - "7788:7788"

volumes:
  cpanel_ddns_config:

x-casaos:
  architectures:
    - amd64
    - arm64
    - arm
  main: cpanel-ddns-ui
  category: Network
  author: "Sungvn"
  developer: "Sungvn"
  title:
    en_us: "cPanel - Plesk DDNS (UI)"
  tagline:
    en_us: "Dynamic DNS updater with web dashboard"
  description:
    en_us: "A CasaOS app with a web UI to configure and run cPanel or Plesk Dynamic DNS updates (auto-update + test button + status)."
  icon: "https://cdn.jsdelivr.net/gh/Sungvn/casaos-cpanel-ddns@main/Apps/CpanelDynamicDNS/icon.png"
  thumbnail: "https://cdn.jsdelivr.net/gh/Sungvn/casaos-cpanel-ddns@main/Apps/CpanelDynamicDNS/thumbnail.jpg"
  screenshots:
    - "https://cdn.jsdelivr.net/gh/Sungvn/casaos-cpanel-ddns@main/Apps/CpanelDynamicDNS/screenshot-1.png"
  tips:
    before_install:
      en_us: |
        After install, open the app UI and paste your cPanel or Plesk Dynamic DNS webcall URL.
        Treat the webcall URL like a password.
  port_map: "7788"
  scheme: "http"
  index: "/"
